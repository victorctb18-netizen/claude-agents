name: install
on: [push, pull_request]
jobs:
  idempotente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bash test/install.sh
      - run: bash test/merge.sh
      - run: bash test/worker-nudge.sh
      - run: bash test/explorer-nudge.sh
      - run: bash test/entrega.sh
      - run: bash test/agent-model.sh
      - run: bash test/decisoes.sh
      - run: bash test/arvore.sh
      - run: bash test/status-sessao.sh
      - run: bash test/stats.sh
      - run: node test/frontmatter.js
